name: rto_expert
description: RTO Expert - Learn, Practice and pass your RTO driving license exam.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Local persistence (state/language/theme/settings, exam history, contributions)
  shared_preferences: ^2.2.3

  # Local structured storage for question bank / schools (offline-first)
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Maps for driving schools / RTO offices
  google_maps_flutter: ^2.6.1
  geolocator: ^12.0.0

  # Ads (banner + rewarded interstitial)
  google_mobile_ads: ^5.1.0

  # Networking (moderation queue, remote question-bank updates, payments)
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/data/
